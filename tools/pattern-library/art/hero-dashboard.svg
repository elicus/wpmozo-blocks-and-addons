	<circle cx="326" cy="744" r="14" fill="#e0e7ff"/>
	<rect x="352" y="736" width="160" height="10" rx="5" fill="#cbd5e1"/>
	<rect x="352" y="752" width="100" height="8" rx="4" fill="#e2e8f0"/>
