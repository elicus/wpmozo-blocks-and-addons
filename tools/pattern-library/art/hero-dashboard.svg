<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
	<!-- Original illustration for the "Product launch hero" pilot pattern. Rendered to media/hero-dashboard.<revision>.webp by render-art.cjs. -->
	<defs>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e1b4b" flood-opacity="0.16"/>
		</filter>
		<filter id="shadow-sm" x="-20%" y="-30%" width="140%" height="170%">
			<feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.18"/>
		</filter>
		<clipPath id="window">
			<rect x="60" y="90" width="1000" height="760" rx="24"/>
		</clipPath>
		<linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/>
			<stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6366f1"/>
			<stop offset="1" stop-color="#8b5cf6"/>
		</linearGradient>
	</defs>

	<!-- App window -->
