	<text x="956" y="749" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Live</text>
	<circle cx="326" cy="794" r="14" fill="#fde68a"/>
	<rect x="352" y="786" width="200" height="10" rx="5" fill="#cbd5e1"/>
